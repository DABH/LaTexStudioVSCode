name: Publish VS Code Extension

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/publish.yml'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build & package only, do not publish'
        type: boolean
        default: false
      publish_ovsx:
        description: 'Also publish to Open VSX'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build, Package & Publish
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    env:
      # Skip the postinstall script that downloads the Tectonic binary —
      # the engine is fetched at runtime by the extension itself, and
      # `bin/**` is excluded by .vscodeignore anyway.
      LATEXSTUDIO_SKIP_DOWNLOAD: '1'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Need previous commit to detect version bumps on push-to-main.
          fetch-depth: 2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - name: Read extension identifier
        id: pkg
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          publisher=$(node -p "require('./package.json').publisher")
          name=$(node -p "require('./package.json').name")
          vsix="${publisher}.${name}-${version}.vsix"
          {
            echo "version=$version"
            echo "publisher=$publisher"
            echo "name=$name"
            echo "vsix=$vsix"
          } >> "$GITHUB_OUTPUT"
          echo "Will package as $vsix"

      - name: Decide whether to publish
        id: gate
        shell: bash
        run: |
          # Manual dispatch always proceeds (dry_run controls publish steps).
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "proceed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          current="${{ steps.pkg.outputs.version }}"
          previous=""
          if git show HEAD~1:app/package.json > /tmp/prev-package.json 2>/dev/null; then
            previous=$(node -p "require('/tmp/prev-package.json').version" 2>/dev/null || echo "")
          fi
          echo "Previous version: ${previous:-<none>}"
          echo "Current  version: $current"
          if [ -z "$previous" ] || [ "$current" != "$previous" ]; then
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          else
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Version unchanged ($current) — skipping build & publish."
          fi

      - name: Install dependencies
        if: steps.gate.outputs.proceed == 'true'
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install --no-audit --no-fund
          fi

      - name: Compile
        if: steps.gate.outputs.proceed == 'true'
        run: npm run compile

      - name: Install vsce & ovsx
        if: steps.gate.outputs.proceed == 'true'
        run: npm install --no-save @vscode/vsce ovsx

      - name: Package VSIX
        if: steps.gate.outputs.proceed == 'true'
        run: npx vsce package --out "${{ steps.pkg.outputs.vsix }}"

      - name: Upload VSIX artifact
        if: steps.gate.outputs.proceed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.pkg.outputs.publisher }}.${{ steps.pkg.outputs.name }}-${{ steps.pkg.outputs.version }}
          path: app/${{ steps.pkg.outputs.vsix }}
          if-no-files-found: error

      - name: Publish to VS Code Marketplace
        if: ${{ steps.gate.outputs.proceed == 'true' && github.event.inputs.dry_run != 'true' }}
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: npx vsce publish --packagePath "${{ steps.pkg.outputs.vsix }}"

      - name: Publish to Open VSX
        if: ${{ steps.gate.outputs.proceed == 'true' && github.event.inputs.dry_run != 'true' && (github.event_name != 'workflow_dispatch' || github.event.inputs.publish_ovsx == 'true') }}
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: npx ovsx publish "${{ steps.pkg.outputs.vsix }}" -p "$OVSX_PAT"
        continue-on-error: true

      - name: Create GitHub Release
        if: ${{ steps.gate.outputs.proceed == 'true' && github.event.inputs.dry_run != 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          files: app/${{ steps.pkg.outputs.vsix }}
          generate_release_notes: true
          name: LaTeX Studio v${{ steps.pkg.outputs.version }}
          tag_name: v${{ steps.pkg.outputs.version }}
          fail_on_unmatched_files: true
