name: Publish VS Code Extension

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/publish.yml'
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump (relative to the version on the Marketplace)'
        type: choice
        default: patch
        options: [patch, minor, major]
      dry_run:
        description: 'Build & package only, do not publish'
        type: boolean
        default: false
      publish_ovsx:
        description: 'Also publish to Open VSX'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build, Package & Publish
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    env:
      # Skip the postinstall script that downloads the Tectonic binary —
      # the engine is fetched at runtime by the extension itself, and
      # `bin/**` is excluded by .vscodeignore anyway.
      LATEXSTUDIO_SKIP_DOWNLOAD: '1'
      # Default to patch bumps on push-to-main. workflow_dispatch can override.
      BUMP: ${{ github.event.inputs.bump || 'patch' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - name: Compute next version (auto-bump from Marketplace)
        id: pkg
        shell: bash
        run: |
          set -euo pipefail
          publisher=$(node -p "require('./package.json').publisher")
          name=$(node -p "require('./package.json').name")
          id="${publisher}.${name}"
          echo "Extension id: $id"
          echo "Bump kind:    ${BUMP}"

          # Marketplace lookup runs in Node so we can use built-in fetch.
          # On any failure (404, network, parse) we fall back to the version
          # already in package.json — that path is used on the very first
          # publish when the extension doesn't exist on the Marketplace yet.
          next=$(BUMP="$BUMP" ID="$id" LOCAL="$(node -p "require('./package.json').version")" node <<'NODE'
            const id = process.env.ID;
            const bump = process.env.BUMP || 'patch';
            const local = process.env.LOCAL;

            function nextSemver(v, kind) {
              const [maj, min, pat] = v.split('.').map(n => parseInt(n, 10) || 0);
              if (kind === 'major') return `${maj + 1}.0.0`;
              if (kind === 'minor') return `${maj}.${min + 1}.0`;
              return `${maj}.${min}.${pat + 1}`;
            }

            (async () => {
              try {
                const res = await fetch(
                  'https://marketplace.visualstudio.com/_apis/public/gallery/extensionquery',
                  {
                    method: 'POST',
                    headers: {
                      'Accept': 'application/json;api-version=3.0-preview.1',
                      'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                      filters: [{ criteria: [{ filterType: 7, value: id }] }],
                      flags: 0x100
                    })
                  }
                );
                const j = await res.json();
                const published = j?.results?.[0]?.extensions?.[0]?.versions?.[0]?.version;
                if (published) {
                  const n = nextSemver(published, bump);
                  console.error(`Marketplace latest: ${published}  →  next: ${n}`);
                  process.stdout.write(n);
                  return;
                }
                console.error(`Extension ${id} not found on Marketplace. First publish uses local version: ${local}`);
                process.stdout.write(local);
              } catch (err) {
                console.error(`Marketplace query failed: ${err.message}. Falling back to local version: ${local}`);
                process.stdout.write(local);
              }
            })();
          NODE
          )

          if [ -z "$next" ]; then
            echo "::error::Failed to determine next version."
            exit 1
          fi

          # Update package.json in-flight (not committed back to the repo).
          npm version "$next" --no-git-tag-version --allow-same-version >/dev/null

          vsix="${publisher}.${name}-${next}.vsix"
          {
            echo "version=$next"
            echo "publisher=$publisher"
            echo "name=$name"
            echo "id=$id"
            echo "vsix=$vsix"
          } >> "$GITHUB_OUTPUT"
          echo "Packaging as: $vsix"

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install --no-audit --no-fund
          fi

      - name: Compile
        run: npm run compile

      - name: Install vsce & ovsx
        run: npm install --no-save @vscode/vsce ovsx

      - name: Package VSIX
        run: npx vsce package --allow-missing-repository --out "${{ steps.pkg.outputs.vsix }}"

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.pkg.outputs.id }}-${{ steps.pkg.outputs.version }}
          path: app/${{ steps.pkg.outputs.vsix }}
          if-no-files-found: error

      - name: Publish to VS Code Marketplace
        if: ${{ github.event.inputs.dry_run != 'true' }}
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: npx vsce publish --packagePath "${{ steps.pkg.outputs.vsix }}"

      - name: Publish to Open VSX
        if: ${{ github.event.inputs.dry_run != 'true' && (github.event_name != 'workflow_dispatch' || github.event.inputs.publish_ovsx == 'true') }}
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: npx ovsx publish "${{ steps.pkg.outputs.vsix }}" -p "$OVSX_PAT"
        continue-on-error: true

      - name: Create GitHub Release
        if: ${{ github.event.inputs.dry_run != 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          files: app/${{ steps.pkg.outputs.vsix }}
          generate_release_notes: true
          name: LaTeX Studio v${{ steps.pkg.outputs.version }}
          tag_name: v${{ steps.pkg.outputs.version }}
          fail_on_unmatched_files: true
