name: Publish VS Code Extension

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/publish.yml'

permissions:
  contents: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build, Package & Publish
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    env:
      # Skip the postinstall script that downloads the Tectonic binary —
      # the engine is fetched at runtime by the extension itself, and
      # `bin/**` is excluded by .vscodeignore anyway.
      LATEXSTUDIO_SKIP_DOWNLOAD: '1'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - name: Compute next version (auto-bump from Marketplace)
        id: pkg
        shell: bash
        run: |
          set -euo pipefail
          publisher=$(node -p "require('./package.json').publisher")
          name=$(node -p "require('./package.json').name")
          local_version=$(node -p "require('./package.json').version")
          id="${publisher}.${name}"
          echo "Extension id:  $id"
          echo "Local version: ${local_version}"

          # Query the public Marketplace API (no auth required for read).
          # Pipe the JSON into `node -e` via stdin to dodge all heredoc / quoting issues.
          resp=$(curl -fsS -X POST \
            "https://marketplace.visualstudio.com/_apis/public/gallery/extensionquery" \
            -H "Accept: application/json;api-version=3.0-preview.1" \
            -H "Content-Type: application/json" \
            --data "{\"filters\":[{\"criteria\":[{\"filterType\":7,\"value\":\"$id\"}]}],\"flags\":914}" \
            || echo '')

          published=""
          if [ -n "$resp" ]; then
            published=$(printf '%s' "$resp" | node -e "
              let s='';process.stdin.on('data',d=>s+=d);process.stdin.on('end',()=>{
                try {
                  const j = JSON.parse(s);
                  const v = j?.results?.[0]?.extensions?.[0]?.versions?.[0]?.version;
                  console.log(v || '');
                } catch { console.log(''); }
              });
            ")
          fi

          if [ -z "$published" ]; then
            # First-ever publish: use the version already in package.json as-is.
            next="$local_version"
            echo "Extension $id not found on Marketplace. First publish uses local: $next"
          else
            next=$(node -e "
              const [a,b,c] = '$published'.split('.').map(n => parseInt(n,10) || 0);
              console.log(a + '.' + b + '.' + (c + 1));
            ")
            echo "Marketplace latest: $published  ->  next: $next"
          fi

          # Update package.json in-flight (not committed back to the repo).
          npm version "$next" --no-git-tag-version --allow-same-version >/dev/null

          vsix="${publisher}.${name}-${next}.vsix"
          {
            echo "version=$next"
            echo "publisher=$publisher"
            echo "name=$name"
            echo "id=$id"
            echo "vsix=$vsix"
          } >> "$GITHUB_OUTPUT"
          echo "Packaging as:  $vsix"

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install --no-audit --no-fund
          fi

      - name: Compile
        run: npm run compile

      - name: Install vsce & ovsx
        run: npm install --no-save @vscode/vsce ovsx

      - name: Package VSIX
        run: npx vsce package --allow-missing-repository --out "${{ steps.pkg.outputs.vsix }}"

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.pkg.outputs.id }}-${{ steps.pkg.outputs.version }}
          path: app/${{ steps.pkg.outputs.vsix }}
          if-no-files-found: error

      - name: Publish to VS Code Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: npx vsce publish --packagePath "${{ steps.pkg.outputs.vsix }}"

      - name: Publish to Open VSX
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          if [ -z "${OVSX_PAT:-}" ]; then
            echo "OVSX_PAT not set; skipping Open VSX publish."
            exit 0
          fi
          npx ovsx publish "${{ steps.pkg.outputs.vsix }}" -p "$OVSX_PAT"
        continue-on-error: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: app/${{ steps.pkg.outputs.vsix }}
          generate_release_notes: true
          name: LaTeX Studio v${{ steps.pkg.outputs.version }}
          tag_name: v${{ steps.pkg.outputs.version }}
          fail_on_unmatched_files: true
